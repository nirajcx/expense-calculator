# Alembic Configuration File
# ──────────────────────────────────

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template used when generating new migration files
# file_template = %%(rev)s_%%(slug)s

# The database URL (this gets overridden by env.py from our app settings)
sqlalchemy.url = postgresql://postgres:admin@localhost:5432/expense_tracker

# Prepend sys.path so that "app" package is importable
prepend_sys_path = .

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = FileHandler
args = ('alembic.log',)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
